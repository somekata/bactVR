<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>バイキンズARカメラ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Yomogi&family=Zen Kurenaido&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a1a;
    --panel: rgba(15,15,35,0.92);
    --accent: #ff4fd8;
    --accent2: #4fffb0;
    --accent3: #ffe94f;
    --text: #f0eeff;
    --muted: #8888aa;
    --border: rgba(255,79,216,0.3);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Yomogi', 'Zen Kurenaido', cursive;
    overflow: hidden;
    touch-action: none;
  }

  /* ===== SCREENS ===== */
  .screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    transition: opacity 0.4s, transform 0.4s;
  }
  .screen.hidden {
    opacity: 0; pointer-events: none; transform: translateY(30px);
  }

  /* ===== SELECT SCREEN ===== */
  #selectScreen {
    background: linear-gradient(160deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a1a 100%);
    padding: 0;
    overflow-y: auto;
  }

  .select-header {
    padding: 28px 20px 10px;
    text-align: center;
  }
  .select-header h1 {
    font-size: 2rem;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }
  .select-header p {
    font-size: 0.78rem;
    color: var(--muted);
  }

  .chara-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 14px 14px 6px;
  }

  .chara-card {
    background: rgba(255,255,255,0.04);
    border: 2px solid transparent;
    border-radius: 16px;
    padding: 10px 6px 8px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .chara-card::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,79,216,0.1), rgba(79,255,176,0.1));
    opacity: 0;
    transition: opacity 0.2s;
  }
  .chara-card.selected {
    border-color: var(--accent);
    background: rgba(255,79,216,0.12);
    transform: scale(1.03);
  }
  .chara-card.selected::before { opacity: 1; }
  .chara-card img {
    width: 100%; max-width: 80px;
    height: 80px;
    object-fit: contain;
    display: block;
    margin: 0 auto 6px;
  }
  .chara-card .chara-name {
    font-size: 0.62rem;
    color: var(--text);
    line-height: 1.3;
    min-height: 2.6em;
  }
  .chara-card .check-badge {
    position: absolute; top: 6px; right: 6px;
    width: 20px; height: 20px;
    background: var(--accent);
    border-radius: 50%;
    display: none;
    align-items: center; justify-content: center;
    font-size: 0.65rem;
    color: #fff;
    font-weight: bold;
    box-shadow: 0 0 8px var(--accent);
  }
  .chara-card.selected .check-badge { display: flex; }

  .select-all-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 8px 14px 0;
  }
  .btn-small {
    font-family: inherit;
    font-size: 0.72rem;
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.05);
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-small:active { transform: scale(0.95); }

  /* ===== POSITION SCREEN ===== */
  #posScreen {
    background: linear-gradient(160deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a1a 100%);
    padding: 28px 20px 20px;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  #posScreen h2 {
    font-size: 1.4rem;
    text-align: center;
    background: linear-gradient(90deg, var(--accent2), var(--accent3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #posScreen p {
    font-size: 0.78rem;
    color: var(--muted);
    text-align: center;
    margin-top: -10px;
  }

  .pos-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 14px;
    width: 100%;
    max-width: 300px;
  }
  .pos-btn {
    font-family: inherit;
    background: rgba(255,255,255,0.04);
    border: 2px solid transparent;
    border-radius: 16px;
    padding: 22px 10px;
    color: var(--text);
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .pos-btn .pos-icon { font-size: 1.6rem; }
  .pos-btn.selected {
    border-color: var(--accent2);
    background: rgba(79,255,176,0.1);
  }
  .pos-btn:active { transform: scale(0.95); }

  /* ===== BOTTOM NAV ===== */
  .bottom-nav {
    padding: 12px 16px 24px;
    display: flex;
    gap: 10px;
    background: transparent;
  }
  .btn-back {
    font-family: inherit;
    font-size: 0.85rem;
    padding: 12px 20px;
    border-radius: 30px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    flex: 0 0 auto;
  }
  .btn-next {
    font-family: inherit;
    font-size: 0.95rem;
    padding: 14px 0;
    border-radius: 30px;
    border: none;
    background: linear-gradient(90deg, var(--accent), #c020ff);
    color: #fff;
    cursor: pointer;
    flex: 1;
    font-weight: bold;
    letter-spacing: 0.05em;
    box-shadow: 0 4px 20px rgba(255,79,216,0.4);
    transition: all 0.2s;
  }
  .btn-next:active { transform: scale(0.97); }
  .btn-next:disabled {
    background: #333;
    box-shadow: none;
    color: #666;
  }

  /* ===== CAMERA SCREEN ===== */
  #cameraScreen {
    background: #000;
  }

  #videoEl {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }

  #charaLayer {
    position: absolute; inset: 0;
    pointer-events: none;
  }

  .ar-chara {
    position: absolute;
    transition: none;
    filter: drop-shadow(0 4px 16px rgba(0,0,0,0.7));
  }
  .ar-chara img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
  }

  /* Single chara size control */
  #sizeControl {
    position: absolute;
    bottom: 110px; left: 50%;
    transform: translateX(-50%);
    width: 200px;
    background: rgba(0,0,0,0.55);
    border-radius: 20px;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.15);
    z-index: 30;
  }
  #sizeControl.hidden { display: none; }
  #sizeControl span { font-size: 0.7rem; color: #ccc; white-space: nowrap; }
  #sizeSlider {
    flex: 1;
    -webkit-appearance: none;
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    outline: none;
  }
  #sizeSlider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 6px rgba(255,79,216,0.8);
  }

  /* Camera controls */
  #camControls {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 16px 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(transparent, rgba(0,0,0,0.7));
    z-index: 30;
  }

  .btn-cam-back {
    font-family: inherit;
    font-size: 0.8rem;
    padding: 10px 18px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(0,0,0,0.5);
    color: #fff;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }

  .btn-shutter {
    width: 70px; height: 70px;
    border-radius: 50%;
    border: 4px solid #fff;
    background: rgba(255,255,255,0.2);
    cursor: pointer;
    position: relative;
    backdrop-filter: blur(6px);
    transition: all 0.1s;
    flex-shrink: 0;
  }
  .btn-shutter::after {
    content: '';
    position: absolute; inset: 6px;
    border-radius: 50%;
    background: #fff;
    transition: all 0.1s;
  }
  .btn-shutter:active { transform: scale(0.92); }
  .btn-shutter:active::after { background: var(--accent); }

  .btn-flip {
    font-family: inherit;
    font-size: 0.8rem;
    padding: 10px 18px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(0,0,0,0.5);
    color: #fff;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }

  /* Flash effect */
  #flashEl {
    position: absolute; inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 50;
    transition: opacity 0.08s;
  }
  #flashEl.flash { opacity: 1; }

  /* ===== PREVIEW SCREEN ===== */
  #previewScreen {
    background: #000;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }

  #previewImg {
    max-width: 100%;
    max-height: calc(100vh - 180px);
    object-fit: contain;
    border-radius: 12px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.8);
  }

  .preview-actions {
    display: flex;
    gap: 12px;
    padding: 0 20px;
    width: 100%;
  }
  .btn-save {
    font-family: inherit;
    font-size: 0.95rem;
    padding: 14px 0;
    border-radius: 30px;
    border: none;
    background: linear-gradient(90deg, var(--accent2), #00cc88);
    color: #000;
    font-weight: bold;
    cursor: pointer;
    flex: 1;
    box-shadow: 0 4px 20px rgba(79,255,176,0.4);
  }
  .btn-retake {
    font-family: inherit;
    font-size: 0.95rem;
    padding: 14px 0;
    border-radius: 30px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    flex: 1;
  }

  /* ===== PERMISSION ERROR ===== */
  #permError {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 30px;
    background: rgba(0,0,0,0.85);
    z-index: 60;
  }
  #permError.show { display: flex; }
  #permError p { text-align: center; line-height: 1.7; color: var(--text); }

  /* Stars bg */
  .stars {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .star {
    position: absolute;
    width: 2px; height: 2px;
    background: #fff;
    border-radius: 50%;
    opacity: 0;
    animation: twinkle var(--d, 3s) var(--delay, 0s) infinite;
  }
  @keyframes twinkle {
    0%,100% { opacity: 0; }
    50% { opacity: var(--op, 0.8); }
  }
</style>
</head>
<body>

<!-- Stars -->
<div class="stars" id="stars"></div>

<!-- ===== SCREEN 1: CHARACTER SELECT ===== -->
<div class="screen" id="selectScreen">
  <div class="select-header">
    <h1>🦠 バイキンズ</h1>
    <p>いっしょに撮ろう！キャラを選んでね</p>
  </div>

  <div class="chara-grid" id="charaGrid"></div>

  <div class="select-all-row">
    <button class="btn-small" onclick="selectAll()">全員選ぶ</button>
    <button class="btn-small" onclick="selectNone()">リセット</button>
  </div>

  <div style="flex:1"></div>
  <div class="bottom-nav" style="padding-top:0">
    <button class="btn-next" id="btnToPos" onclick="goToPos()" disabled>
      場所を選ぶ →
    </button>
  </div>
</div>

<!-- ===== SCREEN 2: POSITION SELECT ===== -->
<div class="screen hidden" id="posScreen">
  <h2>どこに置く？</h2>
  <p id="posNote">キャラが1体のとき：好きな場所を選べます</p>

  <div class="pos-grid" id="posGrid">
    <button class="pos-btn" data-pos="top-left"    onclick="selectPos(this)">
      <span class="pos-icon">↖️</span><span>左上</span>
    </button>
    <button class="pos-btn" data-pos="top-right"   onclick="selectPos(this)">
      <span class="pos-icon">↗️</span><span>右上</span>
    </button>
    <button class="pos-btn" data-pos="left"        onclick="selectPos(this)">
      <span class="pos-icon">⬅️</span><span>左横</span>
    </button>
    <button class="pos-btn" data-pos="right"       onclick="selectPos(this)">
      <span class="pos-icon">➡️</span><span>右横</span>
    </button>
  </div>

  <div style="flex:1"></div>
  <div class="bottom-nav">
    <button class="btn-back" onclick="goBack('selectScreen')">← 戻る</button>
    <button class="btn-next" id="btnToCamera" onclick="goToCamera()">
      カメラ起動 📷
    </button>
  </div>
</div>

<!-- ===== SCREEN 3: CAMERA ===== -->
<div class="screen hidden" id="cameraScreen">
  <video id="videoEl" autoplay playsinline muted></video>
  <div id="charaLayer"></div>

  <div id="sizeControl">
    <span>🔍</span>
    <input type="range" id="sizeSlider" min="60" max="300" value="140" oninput="updateSize()">
    <span>サイズ</span>
  </div>

  <div id="camControls">
    <button class="btn-cam-back" onclick="stopCamera()">← 戻る</button>
    <button class="btn-shutter" onclick="takePhoto()"></button>
    <button class="btn-flip" onclick="flipCamera()">🔄 反転</button>
  </div>

  <div id="flashEl"></div>

  <div id="permError">
    <p>📵 カメラへのアクセスが<br>許可されていません。<br>ブラウザの設定からカメラを許可してください。</p>
    <button class="btn-small" onclick="document.getElementById('permError').classList.remove('show')">閉じる</button>
  </div>
</div>

<!-- ===== SCREEN 4: PREVIEW ===== -->
<div class="screen hidden" id="previewScreen">
  <img id="previewImg" src="" alt="撮影した写真">
  <div class="preview-actions">
    <button class="btn-save" onclick="savePhoto()">💾 保存</button>
    <button class="btn-retake" onclick="retakePhoto()">📷 撮り直す</button>
  </div>
</div>

<canvas id="offscreen" style="display:none"></canvas>

<script>
// ===== DATA =====
const CHARAS = [
  { id:'chara1',  name:'ハイエンキューキン王',      url:'https://somekata.github.io/baikinscharacters/img/chara1.png'  },
  { id:'chara2',  name:'インフルエンザキンXV世女王', url:'https://somekata.github.io/baikinscharacters/img/chara2.png'  },
  { id:'chara3',  name:'マイコプラズマ姫',           url:'https://somekata.github.io/baikinscharacters/img/chara3.png'  },
  { id:'chara4',  name:'レジオネラ爺や',             url:'https://somekata.github.io/baikinscharacters/img/chara4.png'  },
  { id:'chara9',  name:'ビブリ男コレラ',             url:'https://somekata.github.io/baikinscharacters/img/chara9.png'  },
  { id:'chara6',  name:'ベロダシ',                   url:'https://somekata.github.io/baikinscharacters/img/chara6.png'  },
  { id:'chara11', name:'リョクノーキン',             url:'https://somekata.github.io/baikinscharacters/img/chara11.png' },
];

// ===== STATE =====
let selected = new Set();
let chosenPos = 'right';
let stream = null;
let facingMode = 'environment';
let charaSize = 140;
let capturedBlob = null;
let loadedImages = {};

// ===== STARS =====
(function(){
  const s = document.getElementById('stars');
  for(let i=0;i<60;i++){
    const d = document.createElement('div');
    d.className='star';
    d.style.left = Math.random()*100+'%';
    d.style.top  = Math.random()*100+'%';
    d.style.setProperty('--d',  (2+Math.random()*4)+'s');
    d.style.setProperty('--delay', (Math.random()*5)+'s');
    d.style.setProperty('--op', (0.4+Math.random()*0.6).toFixed(2));
    s.appendChild(d);
  }
})();

// ===== BUILD CHARA GRID =====
(function(){
  const grid = document.getElementById('charaGrid');
  CHARAS.forEach(c => {
    const card = document.createElement('div');
    card.className = 'chara-card';
    card.dataset.id = c.id;
    card.innerHTML = `
      <img src="${c.url}" alt="${c.name}" loading="lazy">
      <div class="chara-name">${c.name}</div>
      <div class="check-badge">✓</div>
    `;
    card.onclick = () => toggleChara(c.id, card);
    grid.appendChild(card);

    // preload
    const img = new Image();
    img.src = c.url;
    img.onload = () => { loadedImages[c.id] = img; };
    loadedImages[c.id] = img;
  });
})();

function toggleChara(id, card) {
  if(selected.has(id)) { selected.delete(id); card.classList.remove('selected'); }
  else                 { selected.add(id);    card.classList.add('selected');    }
  document.getElementById('btnToPos').disabled = selected.size === 0;
}
function selectAll()  { document.querySelectorAll('.chara-card').forEach(c => { selected.add(c.dataset.id); c.classList.add('selected'); }); document.getElementById('btnToPos').disabled=false; }
function selectNone() { document.querySelectorAll('.chara-card').forEach(c => { c.classList.remove('selected'); }); selected.clear(); document.getElementById('btnToPos').disabled=true; }

// ===== NAVIGATE =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}
function goBack(to) { showScreen(to); }

function goToPos() {
  if(selected.size === 0) return;
  const note = document.getElementById('posNote');
  const multi = selected.size > 1;
  if(multi) {
    note.textContent = '複数キャラは自動で配置されます';
    document.getElementById('btnToCamera').disabled = false;
    // auto-select dummy
    chosenPos = 'auto';
  } else {
    note.textContent = 'キャラが1体のとき：好きな場所を選べます';
    chosenPos = null;
    document.getElementById('btnToCamera').disabled = true;
  }
  // reset pos buttons
  document.querySelectorAll('.pos-btn').forEach(b => b.classList.remove('selected'));
  if(multi) {
    document.querySelectorAll('.pos-btn').forEach(b => { b.style.opacity='0.4'; b.style.pointerEvents='none'; });
  } else {
    document.querySelectorAll('.pos-btn').forEach(b => { b.style.opacity=''; b.style.pointerEvents=''; });
  }
  showScreen('posScreen');
}

function selectPos(btn) {
  if(selected.size > 1) return;
  document.querySelectorAll('.pos-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  chosenPos = btn.dataset.pos;
  document.getElementById('btnToCamera').disabled = false;
}

async function goToCamera() {
  showScreen('cameraScreen');
  document.getElementById('sizeControl').classList.toggle('hidden', selected.size > 1);
  charaSize = parseInt(document.getElementById('sizeSlider').value);
  await startCamera();
  renderCharas();
}

// ===== CAMERA =====
async function startCamera() {
  try {
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode, width:{ideal:1280}, height:{ideal:720} },
      audio: false
    });
    document.getElementById('videoEl').srcObject = stream;
  } catch(e) {
    document.getElementById('permError').classList.add('show');
  }
}

async function flipCamera() {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  await startCamera();
}

function stopCamera() {
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream = null;
  showScreen('posScreen');
}

// ===== RENDER CHARAS =====
function renderCharas() {
  const layer = document.getElementById('charaLayer');
  layer.innerHTML = '';
  const ids = [...selected];
  const n = ids.length;
  if(n === 0) return;

  const vw = window.innerWidth;
  const vh = window.innerHeight;

  if(n === 1) {
    placeChara(layer, ids[0], chosenPos, vw, vh, charaSize);
  } else {
    const positions = autoPositions(n);
    ids.forEach((id, i) => {
      const sz = Math.min(vw, vh) * 0.28;
      placeChara(layer, id, positions[i], vw, vh, sz);
    });
  }
}

function autoPositions(n) {
  const slots = ['bottom-left','bottom-right','top-left','top-right','left','right','bottom-center','top-center'];
  return slots.slice(0, n);
}

function placeChara(layer, id, pos, vw, vh, sz) {
  const chara = CHARAS.find(c=>c.id===id);
  if(!chara) return;

  const el = document.createElement('div');
  el.className = 'ar-chara';
  el.style.width  = sz+'px';
  el.style.height = sz+'px';

  const img = document.createElement('img');
  img.src = chara.url;
  img.alt = chara.name;
  img.crossOrigin = 'anonymous';
  el.appendChild(img);

  // Position mapping
  const pad = 8;
  const posMap = {
    'right':         { left: vw - sz - pad,     top:  (vh - sz) / 2 },
    'left':          { left: pad,                top:  (vh - sz) / 2 },
    'top-right':     { left: vw - sz - pad,     top:  pad + 60 },
    'top-left':      { left: pad,                top:  pad + 60 },
    'bottom-right':  { left: vw - sz - pad,     top:  vh - sz - 90 },
    'bottom-left':   { left: pad,                top:  vh - sz - 90 },
    'bottom-center': { left: (vw - sz) / 2,     top:  vh - sz - 90 },
    'top-center':    { left: (vw - sz) / 2,     top:  pad + 60 },
  };

  const p = posMap[pos] || posMap['right'];
  el.style.left = p.left + 'px';
  el.style.top  = p.top  + 'px';

  layer.appendChild(el);
}

function updateSize() {
  charaSize = parseInt(document.getElementById('sizeSlider').value);
  renderCharas();
}

// ===== PHOTO =====
async function takePhoto() {
  const video  = document.getElementById('videoEl');
  const canvas = document.getElementById('offscreen');
  const vw = window.innerWidth;
  const vh = window.innerHeight;

  // match device pixel ratio for crisp output
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = vw * dpr;
  canvas.height = vh * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  // draw video
  const vNatW = video.videoWidth  || vw;
  const vNatH = video.videoHeight || vh;
  const scale = Math.max(vw/vNatW, vh/vNatH);
  const dw = vNatW * scale;
  const dh = vNatH * scale;
  const dx = (vw - dw) / 2;
  const dy = (vh - dh) / 2;
  ctx.drawImage(video, dx, dy, dw, dh);

  // draw charas
  const ids = [...selected];
  const n   = ids.length;
  const positions = n === 1 ? [chosenPos] : autoPositions(n);

  for(let i=0;i<n;i++){
    const id  = ids[i];
    const pos = positions[i];
    const sz  = n === 1 ? charaSize : Math.min(vw,vh)*0.28;
    const chara = CHARAS.find(c=>c.id===id);
    if(!chara) continue;

    const posMap = {
      'right':         { left: vw - sz - 8,  top: (vh-sz)/2 },
      'left':          { left: 8,             top: (vh-sz)/2 },
      'top-right':     { left: vw - sz - 8,  top: 68 },
      'top-left':      { left: 8,             top: 68 },
      'bottom-right':  { left: vw - sz - 8,  top: vh-sz-90 },
      'bottom-left':   { left: 8,             top: vh-sz-90 },
      'bottom-center': { left: (vw-sz)/2,    top: vh-sz-90 },
      'top-center':    { left: (vw-sz)/2,    top: 68 },
    };
    const p = posMap[pos] || posMap['right'];

    await new Promise(resolve => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        ctx.drawImage(img, p.left, p.top, sz, sz);
        resolve();
      };
      img.onerror = resolve;
      img.src = chara.url + '?v=' + Date.now();
    });
  }

  // flash
  const flash = document.getElementById('flashEl');
  flash.classList.add('flash');
  setTimeout(() => flash.classList.remove('flash'), 150);

  // show preview
  canvas.toBlob(blob => {
    capturedBlob = blob;
    const url = URL.createObjectURL(blob);
    document.getElementById('previewImg').src = url;
    setTimeout(() => showScreen('previewScreen'), 200);
  }, 'image/jpeg', 0.95);
}

function savePhoto() {
  if(!capturedBlob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(capturedBlob);
  a.download = 'baikins_' + Date.now() + '.jpg';
  a.click();
}

function retakePhoto() {
  showScreen('cameraScreen');
  if(!stream) startCamera();
  renderCharas();
}

// re-render on resize
window.addEventListener('resize', () => {
  if(!document.getElementById('cameraScreen').classList.contains('hidden')) {
    renderCharas();
  }
});
</script>
